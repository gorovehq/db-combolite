[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "combolite-studio"
version = "0.1.0"
description = "Desktop client for the db-combolite embeddable multi-model database"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "gorove", email = "info@gorove.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
]
dependencies = [
    "PyGObject>=3.44.0",
    "numpy>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/gorovehq/db-combolite"
Repository = "https://github.com/gorovehq/db-combolite"
Issues = "https://github.com/gorovehq/db-combolite/issues"

[project.scripts]
combolite-studio = "combolite_gui.app:main"
combolite-gui = "combolite_gui.app:main"

[project.gui-scripts]
combolite-studio = "combolite_gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["combolite_gui*"]

[tool.setuptools.package-data]
combolite_gui = [
    "style.css",
    "*.so",
    ".libs/*.so",
]
